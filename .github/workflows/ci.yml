name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The gateway image (apps/gateway/Dockerfile): a broken Dockerfile or bundle fails here, not at release.
  gateway-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/gateway/Dockerfile -t clane-gateway:ci .
      # Without config it must exit 1 with a one-line config_error (no stack trace).
      - run: |
          set +e
          out=$(docker run --rm clane-gateway:ci 2>&1); code=$?
          echo "$out"
          [ "$code" -eq 1 ] && [ "$(echo "$out" | wc -l)" -eq 1 ] && echo "$out" | grep -q '"event":"config_error"'
