name: clane-vault
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: vault
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
  clane-vault:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: .env
    ports: ["127.0.0.1:8800:3001"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      # Exec form: the image has no shell. The script follows PORT and BASE_PATH.
      test: ["CMD", "node", "dist/src/scripts/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [internal]
networks:
  internal: {}
volumes:
  db-data:
